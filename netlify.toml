# Netlify settings. Preview deploys are built locally and uploaded with
# `npm run deploy:preview` (see CLAUDE.md); these apply if Netlify builds the site.
[build]
  command = "npm run build"
  publish = "dist"

# Renamed projects keep their old links working (project slugs follow folder names).
[[redirects]]
  from = "/projects/mosque/*"
  to = "/projects/community-club/"
  status = 301
