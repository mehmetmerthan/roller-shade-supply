      5% solar screen in living areas and blackout in bedrooms — so the facade
      reads as one consistent surface. Every shade was labeled by unit and room
      and delivered in three phases tied to the contractor's turnover schedule.
    result: >-
      All 412 shades arrived on schedule with no unit mix-ups, and the building
      presents a clean, uniform exterior by day and at night.
